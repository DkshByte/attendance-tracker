<style>
:root {
  --bg:#000; --plate:#0D0D11; --rule:rgba(255,255,255,.2); --rule-soft:rgba(255,255,255,.1); --rail:#26272F;
  --ink:#fff; --ink-2:#A0A4B0; --ink-3:#8A8F9E; --red:#FF4D40; --badge-ink:#08101F; --focus:#4E96FF;
  --gut:clamp(16px, 4vw, 56px);
  /* spring, visual .9s bounce .18, sampled into linear() */
  --arrive:linear(0, 0.021, 0.075, 0.147, 0.234, 0.321, 0.413, 0.496, 0.578, 0.648, 0.714, 0.769, 0.819, 0.859, 0.894, 0.921, 0.945, 0.962, 0.977, 0.988, 0.996, 1.001, 1.006, 1.008, 1.01, 1.01, 1.01, 1.01, 1.009, 1.009, 1.008, 1.007, 1.006, 1.005, 1.004, 1.003, 1.003, 1.002, 1.002, 1.001, 1);
}
*, *::before, *::after { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); }
body { min-height:100svh; display:flex; flex-direction:column; font:400 17px/1.5 Blinker, ui-sans-serif, system-ui, sans-serif;
       font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; padding:0 var(--gut); }
::selection { background:var(--red); color:var(--badge-ink); }
:focus-visible { outline:2px solid var(--focus); outline-offset:3px; border-radius:3px; }
a { color:inherit; }

header { display:flex; align-items:center; height:68px; }
header a { display:flex; color:var(--ink); }
header svg { width:108px; height:26px; fill:currentColor; }

main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:1100px; width:100%; margin:0 auto; padding-block:32px 64px; }

/* the line: solid while there are stations, dashed where nothing is scheduled, a terminus where it ends */
.line { position:relative; height:40px; margin:0 0 40px; }
.track { position:absolute; left:0; top:19px; width:58%; height:2px; background:var(--rail); border-radius:1px; }
.void { position:absolute; left:58%; right:22px; top:18px; border-top:2px dashed var(--rail); }
.stop { position:absolute; top:12px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 3px var(--ink-3); }
.stop:nth-of-type(3) { left:12%; } .stop:nth-of-type(4) { left:34%; } .stop:nth-of-type(5) { left:58%; }
.end { position:absolute; right:12px; top:6px; width:4px; height:28px; border-radius:2px; background:var(--red); }        /* the buffer stop: a square cut, not a station */
.rider { position:absolute; inset:0; }
.marker { position:absolute; left:58%; top:13px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--ink);
          box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--red); }

.code { margin:0; font-size:clamp(96px, 20vw, 220px); line-height:.82; font-weight:900; letter-spacing:-.04em; color:var(--ink); }
h1 { margin:22px 0 0; font-size:clamp(32px, 4.6vw, 56px); line-height:1.02; letter-spacing:-.02em; font-weight:800; text-wrap:balance; }
p.lede { margin:18px 0 0; max-width:44ch; font-size:clamp(17px, 1.6vw, 20px); color:var(--ink-2); text-wrap:pretty; }
.path { display:inline-block; max-width:100%; overflow-wrap:anywhere; padding:1px 8px; border-radius:6px; background:var(--plate); border:1px solid var(--rule-soft); color:var(--ink); font-size:.92em; }

.doors { display:flex; flex-wrap:wrap; gap:12px; margin-top:36px; }
.btn { display:inline-flex; align-items:center; gap:12px; min-height:56px; padding:0 22px; border-radius:12px; text-decoration:none; font-weight:800; font-size:17px;
       transition:transform .43s linear(0, 0.023, 0.078, 0.166, 0.254, 0.362, 0.454, 0.555, 0.634, 0.717, 0.779, 0.84, 0.884, 0.925, 0.953, 0.979, 0.995, 1.008, 1.016, 1.022, 1.024, 1.025, 1.025, 1.024, 1.021, 1.019, 1.016, 1.014, 1.012, 1.009, 1.007, 1.006, 1.004, 1.003, 1.002, 1.001, 1.001, 1, 1, 1, 1), filter .2s; }
.btn svg { width:20px; height:20px; }
.btn:hover { transform:translateY(-2px); filter:brightness(1.06); }
.btn:active { transform:scale(.985); }
.ink { background:var(--ink); color:var(--bg); }
.ghost { background:var(--plate); color:var(--ink); border:1px solid var(--rule); }
.ghost:hover { border-color:var(--ink-3); }
.help { margin-top:28px; font-size:15px; color:var(--ink-3); }
.help a { color:var(--ink-2); text-decoration-color:var(--rail); text-underline-offset:4px; }

footer { display:flex; flex-wrap:wrap; gap:8px 20px; padding:22px 0 calc(22px + env(safe-area-inset-bottom)); border-top:1px solid var(--rule-soft); font-size:14px; color:var(--ink-3); }
footer a { text-decoration:none; color:var(--ink-3); padding:6px 0; }
footer a:hover { color:var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .track { transform-origin:left; animation:draw .7s cubic-bezier(.16,1,.3,1) .05s both; }
  .void { animation:fade .5s ease .55s both; }
  .end { animation:pop .6s var(--arrive) .8s both; }
  .rider { animation:ride 1.2s var(--arrive) .35s both; }
  .code, h1, p.lede, .doors, .help { animation:rise .7s cubic-bezier(.16,1,.3,1) both; }
  h1 { animation-delay:.08s; } p.lede { animation-delay:.14s; } .doors { animation-delay:.2s; } .help { animation-delay:.26s; }
}
@keyframes draw { from { transform:scaleX(0); } }
@keyframes fade { from { opacity:0; } }
@keyframes pop { from { transform:scale(.3); opacity:0; } }
@keyframes ride { from { transform:translateX(-58%); } }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }
@media (max-width:560px) { .doors .btn { flex:1 1 100%; justify-content:space-between; } }
</style>
