<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunkr</title>
<style>html,body{background:#000;margin:0}</style>
</head>
<body>
<script>
/* ============================================================
   Bunkr — Entry Router
   bunkr.website → landing.html (always, for new visitors)
   bunkr.website?app=1 → app.html (force-bypass for existing users)

   The "Open App" button on landing.html links to app.html directly,
   so existing users who bookmark app.html or click through the
   landing page are never blocked.
   ============================================================ */
(function () {
  "use strict";
  /* ?app=1 hard-bypass — used by the boot loader and direct links */
  if (new URLSearchParams(window.location.search).get("app") === "1") {
    window.location.replace("app.html");
    return;
  }
  /* Everyone else sees the landing page */
  window.location.replace("landing.html");
})();
</script>
</body>
</html>
